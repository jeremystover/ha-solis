# Switch on/off SolisCloud workarounds 

#SolisCloud returns daily on grid energy a factor 10 off
correct_daily_on_grid_energy_enabled: false
#Default energy today is taken from inverter detail. Some experience issues, 
#alternatively use energy today from plant, as it is the sum of all #inverters 
#registered under the plant it can only be used with single inverter per plant
use_energy_today_from_plant: false
#SolisCloud's stationDetail endpoint can time out while inverterDetail still
#answers. The plant name is only read from stationDetail, and an inverter with
#no plant name is normally discarded, taking all of its sensors with it. Set
#this to keep those inverters.
keep_inverter_without_plant_name: true
#SolisCloud regularly takes longer to answer than the 10 seconds this
#integration allowed, which surfaces as TimeoutError and then the misleading
#"No valid inverters found, login failed". Measured against a live account:
#userStationList 10.4s, inverterList 17.8s, stationDetail 5.7s, inverterDetail
#3.4-9.9s. Seconds allowed per request; upstream's fixed value was 10.
http_timeout: 30
